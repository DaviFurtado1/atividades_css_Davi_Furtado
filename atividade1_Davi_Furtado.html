<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades CSS</title>
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            color: white;
            text-align: center;
        }

        p {
            font-family: verdana, Geneva, Tahoma, sans-serif;
            font-size: 20px;
        }

        #para1{
            background-color: rgb(248, 245, 248);
            width: 120px;
            height: 120px;
            border: 1px solid rgb(255, 0, 221);
            margin: 20px;
            padding-top: 20px;
            color: rgb(7, 7, 0);
            font-size: 20px;

        }
        .centralizado{
            text-align: center;
            color: green;
            
        }
    </style>

</head>

<body>
    <h1>Meu primeiro CSS de exemplo</h1>
    <p>esse é meu primeiro paragrafo estilizado</p>
    <div id="para1">Dar n</div>
    <div class="centralizado.">Texto 02</div>

</body>

</html>
